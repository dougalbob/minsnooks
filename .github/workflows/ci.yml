name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same bootstrap as SANDBOX.md §0: better-sqlite3 ships a bundled
      # prebuild; --ignore-scripts skips its build-from-source install script.
      - run: npm ci --ignore-scripts
      - run: npx svelte-kit sync

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run check

      - name: Production build
        run: npm run build
