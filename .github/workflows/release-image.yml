name: Publish container image

# Deliberately separate from ci.yml: this only ever runs for an explicit git
# tag (or a manual dispatch), never on every push to main/arena branches.
# Unraid should pin an exact tag (docs/deployment.md), never a floating one.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      extra_tag:
        description: 'Optional extra image tag to publish alongside the commit SHA (e.g. staging)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation for multi-arch build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:sha-${GITHUB_SHA::7}"
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "$IMAGE:${GITHUB_REF_NAME}"
              # Only float :latest for a stable release tag (vX.Y.Z), never for
              # a pre-release like vX.Y.Z-rc.1 — Unraid should pin explicitly.
              if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "$IMAGE:latest"
              fi
            fi
            if [ -n "${{ github.event.inputs.extra_tag }}" ]; then
              echo "$IMAGE:${{ github.event.inputs.extra_tag }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
